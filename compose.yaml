services:
  shoal:
    build: .
    init: true
    env_file: .env.local
    environment:
      SHOAL_BIND: 0.0.0.0
      SHOAL_DATA_DIR: /data
      SHOAL_SOURCES_DIR: /data/sources
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - shoal-data:/data
    restart: unless-stopped
volumes:
  shoal-data:
