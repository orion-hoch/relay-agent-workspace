services:
  shoal:
    environment:
      DATABASE_URL: postgresql://shoal:${SHOAL_POSTGRES_PASSWORD:?Set SHOAL_POSTGRES_PASSWORD in your shell}@postgres:5432/shoal
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shoal
      POSTGRES_DB: shoal
      POSTGRES_PASSWORD: ${SHOAL_POSTGRES_PASSWORD:?Set SHOAL_POSTGRES_PASSWORD in your shell}
    volumes:
      - shoal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoal -d shoal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  shoal-postgres:
